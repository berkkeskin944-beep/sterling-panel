name = "dostluk-panel-worker"
main = "_worker.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
BOT_SECRET = "your-bot-secret-here"

[[kv_namespaces]]
binding = "PHOTOS_KV"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-id"

[[r2_buckets]]
binding = "PHOTOS_R2"
bucket_name = "dostluk-photos"
preview_bucket_name = "dostluk-photos-preview"